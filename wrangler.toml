# Cloudflare Worker configuration for canvas-notion-sync.
#
# Before deploying:
#   1. Create a KV namespace and paste its id below:
#        npx wrangler kv namespace create SETTINGS_KV
#   2. Fill in the two ACCESS_* vars once you've created a Cloudflare Access
#      application in front of this Worker (see README.md). You can set them
#      here, or as secrets with `wrangler secret put`.
#
name = "canvas-notion-sync"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# The cron fires every 15 minutes. The Worker only actually syncs when your
# configured interval (set on the settings page) has elapsed, so this is the
# finest granularity you can pick — it does not force a sync every 15 min.
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Your Cloudflare Access team domain, e.g. "myteam.cloudflareaccess.com".
ACCESS_TEAM_DOMAIN = ""
# The Access application's Audience (AUD) tag from the Access app's settings.
ACCESS_AUD = ""
